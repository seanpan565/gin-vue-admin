aliyun-oss:
    endpoint: yourEndpoint          # OSS 服务 Endpoint，如 oss-cn-hangzhou.aliyuncs.com
    access-key-id: yourAccessKeyId  # 阿里云 AccessKey ID
    access-key-secret: yourAccessKeySecret # 阿里云 AccessKey Secret
    bucket-name: yourBucketName     # 存储桶名称
    bucket-url: yourBucketUrl       # 存储桶外网访问地址
    base-path: yourBasePath         # 文件在桶内的基础路径前缀

# AWS S3 对象存储（仅当 system.oss-type 设为 aws-s3 时生效）
aws-s3:
    bucket: xxxxx-10005608          # S3 存储桶名称
    region: ap-shanghai             # AWS 区域
    endpoint: ""                    # 自定义 Endpoint（兼容 S3 协议的服务可填）
    secret-id: your-secret-id       # Access Key ID
    secret-key: your-secret-key     # Secret Access Key
    base-url: https://gin.vue.admin # 文件访问基础 URL
    path-prefix: mall-admin/server # 对象键前缀
    s3-force-path-style: false      # 是否强制路径风格访问
    disable-ssl: false              # 是否禁用 SSL

# 验证码配置
captcha:
    key-long: 6                     # 验证码字符长度
    img-width: 240                  # 验证码图片宽度（像素）
    img-height: 80                  # 验证码图片高度（像素）
    open-captcha: 0                 # 防爆破：0=每次登录都要验证码；>0=密码错误 N 次后才出现验证码
    open-captcha-timeout: 3600      # 防爆破计数窗口（秒），open-captcha>0 时生效

# Cloudflare R2 对象存储（仅当 system.oss-type 设为 cloudflare-r2 时生效）
cloudflare-r2:
    bucket: xxxx0bucket             # R2 存储桶名称
    base-url: https://gin.vue.admin.com # 文件访问基础 URL
    path: uploads                   # 对象键路径前缀
    account-id: xxx_account_id      # Cloudflare 账号 ID
    access-key-id: xxx_key_id       # R2 Access Key ID
    secret-access-key: xxx_secret_key # R2 Secret Access Key

# 跨域 CORS 配置（需在 initialize/router.go 中取消 CORS 中间件注释后才生效）
cors:
    mode: strict-whitelist          # 模式：strict-whitelist=白名单模式
    whitelist:
        - allow-origin: example1.com
          allow-methods: POST, GET
          allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type
          allow-credentials: true   # 是否允许携带 Cookie
        - allow-origin: example2.com
          allow-methods: GET, POST
          allow-headers: content-type
          expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type
          allow-credentials: true

# 多数据源配置（system.db-type 之外的额外数据库，disable=true 表示未启用）
db-list:
    - type: ""                      # 数据库类型：mysql / pgsql / mssql / oracle / sqlite
      alias-name: ""                # 数据源别名（全局唯一，代码中按此名称获取连接）
      prefix: ""                    # 表名前缀
      port: ""
      config: ""                    # 驱动高级参数（如 charset、sslmode 等）
      db-name: ""
      username: ""
      password: ""
      path: ""                      # 主机地址或 SQLite 文件路径
      engine: ""                    # 存储引擎（MySQL 默认 InnoDB）
      log-mode: ""                  # Gorm 日志级别：silent / error / warn / info
      max-idle-conns: 10            # 连接池最大空闲连接数
      max-open-conns: 100           # 连接池最大打开连接数
      conn-max-lifetime: 0          # 连接最长复用时间（秒），0 表示不限制
      singular: false               # 是否禁用 Gorm 表名复数化
      log-zap: false                # 是否将 Gorm 日志写入 zap 文件
      disable: true                 # 是否禁用此数据源

# 服务器磁盘监控（仪表盘展示磁盘使用率，按需配置）
disk-list:
    - mount-point: /                # 要监控的挂载点

# 邮件发送配置（启用 email 插件或发邮件功能时需要）
email:
    to: xxx@qq.com                  # 默认收件人，多个用英文逗号分隔
    from: xxx@163.com               # 发件人邮箱
    host: smtp.163.com              # SMTP 服务器地址
    secret: xxx                     # SMTP 授权码（非邮箱登录密码）
    nickname: test                  # 发件人显示昵称
    port: 465                       # SMTP 端口
    is-ssl: true                    # 是否启用 SSL
    is-loginauth: false             # 是否使用 LOGIN 认证（IBM/微软邮箱等）

# 华为云 OBS 对象存储（仅当 system.oss-type 设为 huawei-obs 时生效）
hua-wei-obs:
    path: you-path                  # 对象键路径前缀
    bucket: you-bucket              # 存储桶名称
    endpoint: you-endpoint          # OBS 服务 Endpoint
    access-key: you-access-key      # Access Key
    secret-key: you-secret-key      # Secret Key

# JWT 鉴权配置
jwt:
    signing-key: f7fec431-305a-4ff8-a803-c7a5be4d89a5 # Token 签名密钥（已更换为随机 UUID，生产环境请妥善保管）
    expires-time: 7d                # Token 有效期（如 7d、24h）
    buffer-time: 1d                 # 自动续期缓冲时间，剩余不足此时间则刷新 Token
    issuer: qmPlus                  # Token 签发者标识

# 本地文件存储（system.oss-type 设为 local 时生效，默认方案）
local:
    path: uploads/file              # 文件对外访问路径（路由静态资源映射）
    store-path: uploads/file        # 文件实际保存目录

# MinIO 对象存储（仅当 system.oss-type 设为 minio 时生效；配置错误会导致启动 panic）
minio:
    endpoint: yourEndpoint          # MinIO 服务地址
    access-key-id: yourAccessKeyId  # Access Key
    access-key-secret: yourAccessKeySecret # Secret Key
    bucket-name: yourBucketName     # 存储桶名称
    use-ssl: false                  # 是否使用 HTTPS
    base-path: ""                   # 对象键路径前缀
    bucket-url: http://host:9000/yourBucketName # 桶访问 URL

# MongoDB 配置（仅当 system.use-mongo 设为 true 时生效）
mongo:
    coll: ""                        # 默认集合名
    options: ""                     # 连接附加参数
    database: ""                    # 数据库名
    username: ""
    password: ""
    auth-source: ""                 # 认证数据库
    min-pool-size: 0                # 连接池最小连接数
    max-pool-size: 100              # 连接池最大连接数
    socket-timeout-ms: 0            # Socket 超时（毫秒）
    connect-timeout-ms: 0           # 连接超时（毫秒）
    is-zap: false                   # 是否用 zap 记录 Mongo 日志
    hosts:
        - host: ""
          port: ""

# SQL Server 配置（仅当 system.db-type 设为 mssql 时生效）
mssql:
    prefix: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    path: ""                        # 主机地址
    engine: ""
    log-mode: ""
    max-idle-conns: 10
    max-open-conns: 100
    conn-max-lifetime: 0
    singular: false
    log-zap: false

# MySQL 配置（system.db-type 为 mysql 时使用；首次初始化前请勿手动修改，由 /init/initdb 自动写入）
mysql:
    prefix: ""                      # 表名前缀
    port: "3306"                    # 端口
    config: charset=utf8mb4&parseTime=True&loc=Local # DSN 附加参数
    db-name: gva                     # 数据库名
    username: root                  # 用户名
    password: "123456"              # 密码
    path: 127.0.0.1                 # 主机地址
    engine: ""                      # 存储引擎，默认 InnoDB
    log-mode: error                 # Gorm 日志级别
    max-idle-conns: 10              # 连接池最大空闲连接数
    max-open-conns: 100             # 连接池最大打开连接数
    conn-max-lifetime: 0            # 连接最长复用时间（秒）
    singular: false                 # 是否禁用表名复数化
    log-zap: false                  # Gorm 日志是否写入 zap 文件

# Oracle 配置（仅当 system.db-type 设为 oracle 时生效）
oracle:
    prefix: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    path: ""
    engine: ""
    log-mode: ""
    max-idle-conns: 10
    max-open-conns: 100
    conn-max-lifetime: 0
    singular: false
    log-zap: false

# PostgreSQL 配置（仅当 system.db-type 设为 pgsql 时生效）
pgsql:
    prefix: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    path: ""
    engine: ""
    log-mode: ""
    max-idle-conns: 10
    max-open-conns: 100
    conn-max-lifetime: 0
    singular: false
    log-zap: false

# 七牛云对象存储（仅当 system.oss-type 设为 qiniu 时生效）
qiniu:
    zone: ZoneHuaDong               # 存储区域：ZoneHuadong / ZoneHuabei / ZoneHuanan 等
    bucket: ""                      # 存储空间名称
    img-path: ""                    # 图片路径前缀
    access-key: ""                  # Access Key
    secret-key: ""                  # Secret Key
    use-https: false                # 是否使用 HTTPS 访问
    use-cdn-domains: false          # 是否使用 CDN 加速域名

# Redis 主实例配置（system.use-redis 为 true 时连接，供验证码/JWT/限流等使用）
redis:
    name: ""                        # 实例名称（redis-list 中才需要唯一命名）
    addr: 127.0.0.1:6379            # 地址:端口；集群模式下此项无效
    password: ""                    # 密码，无密码留空
    db: 0                           # 数据库编号（0-15）；集群模式下无效
    useCluster: false               # 是否连接 Redis Cluster 集群
    clusterAddrs:                   # Redis Cluster 节点地址列表（useCluster=true 时生效）
        - 172.21.0.3:7000
        - 172.21.0.4:7001
        - 172.21.0.2:7002

# 多 Redis 实例列表（system.use-multipoint 为 true 时额外初始化，按 name 区分）
redis-list:
    - name: cache                   # 实例别名，需在列表中唯一
      addr: 127.0.0.1:6379
      password: ""
      db: 0
      useCluster: false
      clusterAddrs:
        - 172.21.0.3:7000
        - 172.21.0.4:7001
        - 172.21.0.2:7002

# SQLite 配置（仅当 system.db-type 设为 sqlite 时生效）
sqlite:
    prefix: ""
    port: ""
    config: ""
    db-name: ""
    username: ""
    password: ""
    path: ""                        # 数据库文件所在目录
    engine: ""
    log-mode: ""
    max-idle-conns: 10
    max-open-conns: 100
    conn-max-lifetime: 0
    singular: false
    log-zap: false

# 系统核心配置
system:
    db-type: mysql                  # 主数据库类型：mysql(默认) / pgsql / sqlite / mssql / oracle
    oss-type: local                 # 文件存储类型：local / qiniu / aliyun-oss / tencent-cos / huawei-obs / aws-s3 / cloudflare-r2 / minio
    router-prefix: ""               # API 路由全局前缀，如 /api
    addr: 8888                      # 后端 HTTP 服务端口
    iplimit-count: 15000            # 单 IP 在 iplimit-time 窗口内最大请求次数
    iplimit-time: 3600              # IP 限流时间窗口（秒）
    use-multipoint: false           # 是否开启多点登录互踢（需 Redis，同账号新登录会使旧 Token 失效）
    use-redis: true                 # 是否启用 Redis
    use-mongo: false                # 是否启用 MongoDB
    use-strict-auth: false          # 严格角色模式：开启后角色权限存在上下级继承关系
    disable-auto-migrate: false     # 是否禁用 Gorm 自动迁移表结构（生产环境建议 true，改用手动迁移）
    read-timeout: 10m                 # HTTP 读超时
    write-timeout: 10m                # HTTP 写超时

# 腾讯云 COS 对象存储（仅当 system.oss-type 设为 tencent-cos 时生效）
tencent-cos:
    bucket: xxxxx-10005608          # 存储桶名称，格式：bucket-appid
    region: ap-shanghai             # 地域，如 ap-shanghai
    secret-id: your-secret-id       # SecretId
    secret-key: your-secret-key     # SecretKey
    base-url: https://gin.vue.admin # 文件访问基础 URL
    path-prefix: mall-admin/server # 对象键前缀

# 安全加固（详见 README 安全章节）
security:
    swagger-enable: true            # 是否暴露 Swagger 文档（生产环境请设为 false）
    metrics-enable: true            # 是否暴露 Prometheus 指标 /metrics
    metrics-auth-token: ""          # /metrics 访问令牌，留空则不鉴权（生产建议设置）
    error-report-key: ""            # 前端错误上报密钥，留空则仅依赖限流
    auth-limit-count: 30            # 登录/注册等认证接口单 IP 限流次数
    auth-limit-time: 60             # 认证接口限流窗口（秒）
    member-captcha-enable: true     # C 端会员登录/注册是否强制验证码
    upload-allowed-exts: []         # 上传白名单扩展名，留空使用内置默认列表
    upload-max-image-mb: 0.5        # 前端普通上传图片大小上限（MB）
    upload-max-video-mb: 5          # 前端普通上传视频大小上限（MB）

# Zap 日志配置
zap:
    level: info                     # 日志级别：debug / info / warn / error / dpanic / panic / fatal
    prefix: '[mall-admin/server]' # 日志时间戳前缀
    format: console                 # 输出格式：console / json
    director: log                   # 日志文件目录
    encode-level: LowercaseColorLevelEncoder # 级别编码：LowercaseLevelEncoder / LowercaseColorLevelEncoder 等
    stacktrace-key: stacktrace      # 堆栈跟踪字段名
    show-line: true                 # 是否显示代码行号
    log-in-console: true            # 是否同时输出到控制台
    retention-day: -1               # 日志保留天数，-1 表示永久保留
